<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>porq dashboard</title>
<style>
  :root {
    --bg: #12100e;
    --bg-wash: #181510;
    --panel: #1a1714;
    --panel-elev: #211e1a;
    --border: #3a342c;
    --border-soft: #2a2520;
    --text: #f2ebe3;
    --muted: #9a9084;
    --amber: #e8a838;
    --amber-dim: #e8a83833;
    --teal: #3db8a0;
    --teal-dim: #3db8a033;
    --blue: #6a9fbf;
    --blue-dim: #6a9fbf33;
    --gold: #c4a35a;
    --gold-dim: #c4a35a33;
    --green: #6bbf7a;
    --green-dim: #6bbf7a33;
    --yellow: #d4a84b;
    --yellow-dim: #d4a84b33;
    --orange: #d4844a;
    --orange-dim: #d4844a33;
    --purple: #a88bc4;
    --purple-dim: #a88bc433;
    --red: #e06b5c;
    --red-dim: #e06b5c33;
    --font-display: system-ui, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
    --radius: 8px;
    --gap: 0.85rem;
    --scroll-thumb: #4a433a;
    --scroll-thumb-hover: color-mix(in srgb, var(--amber) 40%, #4a433a);
  }

  * { box-sizing: border-box; }

  /* Themed thin scrollbars (Chromium + Firefox) */
  .scroll-themed,
  .table-wrap,
  .event-list,
  .file-grid,
  .canvas-body,
  .canvas-md pre,
  #drawer-body,
  .drawer-cmd,
  .drawer-log {
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
  }
  .scroll-themed::-webkit-scrollbar,
  .table-wrap::-webkit-scrollbar,
  .event-list::-webkit-scrollbar,
  .file-grid::-webkit-scrollbar,
  .canvas-body::-webkit-scrollbar,
  .canvas-md pre::-webkit-scrollbar,
  #drawer-body::-webkit-scrollbar,
  .drawer-cmd::-webkit-scrollbar,
  .drawer-log::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .scroll-themed::-webkit-scrollbar-track,
  .table-wrap::-webkit-scrollbar-track,
  .event-list::-webkit-scrollbar-track,
  .file-grid::-webkit-scrollbar-track,
  .canvas-body::-webkit-scrollbar-track,
  .canvas-md pre::-webkit-scrollbar-track,
  #drawer-body::-webkit-scrollbar-track,
  .drawer-cmd::-webkit-scrollbar-track,
  .drawer-log::-webkit-scrollbar-track {
    background: transparent;
  }
  .scroll-themed::-webkit-scrollbar-thumb,
  .table-wrap::-webkit-scrollbar-thumb,
  .event-list::-webkit-scrollbar-thumb,
  .file-grid::-webkit-scrollbar-thumb,
  .canvas-body::-webkit-scrollbar-thumb,
  .canvas-md pre::-webkit-scrollbar-thumb,
  #drawer-body::-webkit-scrollbar-thumb,
  .drawer-cmd::-webkit-scrollbar-thumb,
  .drawer-log::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .scroll-themed::-webkit-scrollbar-thumb:hover,
  .table-wrap::-webkit-scrollbar-thumb:hover,
  .event-list::-webkit-scrollbar-thumb:hover,
  .file-grid::-webkit-scrollbar-thumb:hover,
  .canvas-body::-webkit-scrollbar-thumb:hover,
  .canvas-md pre::-webkit-scrollbar-thumb:hover,
  #drawer-body::-webkit-scrollbar-thumb:hover,
  .drawer-cmd::-webkit-scrollbar-thumb:hover,
  .drawer-log::-webkit-scrollbar-thumb:hover {
    background: var(--scroll-thumb-hover);
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  /* Page scrollbar (outer chrome) */
  html {
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) var(--bg);
  }
  html::-webkit-scrollbar { width: 10px; height: 10px; }
  html::-webkit-scrollbar-track { background: var(--bg); }
  html::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 8px;
    border: 2px solid var(--bg);
  }
  html::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-display);
    font-size: 13.5px;
    line-height: 1.45;
    background:
      radial-gradient(1100px 420px at 10% -8%, #2a221822 0%, transparent 55%),
      radial-gradient(800px 360px at 92% 0%, #1e2a2622 0%, transparent 50%),
      var(--bg);
    color: var(--text);
  }

  body.drawer-open { overflow: hidden; }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 0.55rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }

  .brand-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: block;
  }

  .brand-text {
    display: flex;
    align-items: baseline;
    gap: 0.65rem;
  }

  .brand-mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--amber);
  }

  .brand-sub {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .view-tabs {
    display: inline-flex;
    gap: 0.25rem;
    padding: 0.2rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
  }

  .view-tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    cursor: pointer;
  }

  .view-tab:hover { color: var(--text); }
  .view-tab.active {
    background: var(--amber-dim);
    color: var(--amber);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
  }

  #workspace {
    color: var(--muted);
    font-size: 0.78rem;
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: var(--panel);
  }

  #stamp {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text);
    font-size: 0.75rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--amber-dim);
    background: var(--amber-dim);
  }

  #stamp::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 var(--amber);
    animation: pulse 1.6s ease-out infinite;
  }

  #stamp.live::before { background: var(--teal); animation: pulse 1.6s ease-out infinite; }
  #stamp.stale {
    border-color: var(--orange-dim);
    background: var(--orange-dim);
    color: var(--orange);
  }
  #stamp.stale::before { animation: none; background: var(--orange); }
  #stamp.error {
    border-color: var(--red-dim);
    background: var(--red-dim);
    color: var(--red);
  }
  #stamp.error::before { background: var(--red); animation: none; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 55%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  #pulse {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0.4rem 1.1rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel);
    cursor: pointer;
    color: var(--muted);
    font-size: 0.78rem;
    font-family: var(--font-mono);
  }

  #pulse:hover { background: var(--panel-elev); color: var(--text); }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
  }

  .pulse-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--bg);
    color: var(--text);
    font-size: 0.72rem;
  }

  .pulse-chip strong { color: var(--amber); font-weight: 600; }

  #pulse-daemon {
    font-size: 0.7rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
  }
  #pulse-daemon.status-done {
    color: var(--green);
    border-color: var(--green-dim);
    background: var(--green-dim);
  }
  #pulse-daemon.status-failed {
    color: var(--red);
    border-color: var(--red-dim);
    background: var(--red-dim);
  }

  .pulse-event {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.72rem;
    max-width: min(55%, 28rem);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #error {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: var(--red-dim);
    border: 1px solid var(--red);
    color: var(--red);
    margin: 1rem 1.25rem 0;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
  }
  #error.visible { display: flex; }

  #error-retry {
    appearance: none;
    border: 1px solid var(--red);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    padding: 0.3rem 0.65rem;
    border-radius: 6px;
    cursor: pointer;
  }
  #error-retry:hover { background: var(--panel-elev); }

  #empty-hint {
    display: none;
    color: var(--muted);
    margin: 0.75rem 1.25rem 0;
    font-size: 0.85rem;
    padding: 0.65rem 0.85rem;
    border-radius: var(--radius);
    border: 1px dashed var(--border-soft);
    background: var(--panel);
  }
  #empty-hint.visible { display: block; }
  #empty-hint.daemon-down {
    border-color: var(--red);
    background: var(--red-dim);
    color: var(--text);
  }
  #empty-hint code {
    color: var(--amber);
    background: var(--bg);
    padding: 0.05rem 0.35rem;
    border-radius: 4px;
  }

  .view { display: none; }
  .view.active { display: block; }

  #view-details.active {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: var(--gap);
    padding: 0.85rem 1rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    #view-details.active { grid-template-columns: 1fr; }
  }

  #view-canvases {
    padding: 0.85rem 1rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  #view-canvases.active { display: block; }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 0.8rem 0.8rem;
    min-height: 0;
    min-width: 0;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin: 0 0 0.55rem;
  }

  h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .count {
    font-size: 0.7rem;
    color: var(--amber);
    background: var(--amber-dim);
    border: 1px solid transparent;
    padding: 0.12rem 0.45rem;
    border-radius: 999px;
    min-width: 1.4rem;
    text-align: center;
  }

  .panel-body { min-width: 0; }

  .placeholder {
    color: var(--muted);
    font-size: 0.82rem;
    margin: 0.35rem 0;
  }
  .placeholder.inline { display: inline; margin: 0; }

  .table-wrap {
    max-height: 260px;
    overflow: auto;
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    font-family: var(--font-mono);
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel-elev);
    color: var(--muted);
    font-weight: 500;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
  }

  th, td {
    text-align: left;
    padding: 0.4rem 0.45rem;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }

  tbody tr:nth-child(even) { background: color-mix(in srgb, var(--bg) 35%, transparent); }
  tbody tr:hover { background: color-mix(in srgb, var(--amber) 8%, transparent); }

  tr.task-row { cursor: pointer; }
  tr.task-row:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }

  td code, .mono {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--muted);
  }

  .cmd-cell { max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pill {
    display: inline-block;
    padding: 0.14rem 0.5rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.3;
    border: 1px solid transparent;
    font-family: var(--font-display);
    letter-spacing: 0.02em;
  }

  .status-done { background: var(--green-dim); color: var(--green); border-color: color-mix(in srgb, var(--green) 25%, transparent); }
  .status-active { background: var(--yellow-dim); color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 25%, transparent); }
  .status-waiting { background: var(--blue-dim); color: var(--blue); border-color: color-mix(in srgb, var(--blue) 25%, transparent); }
  .status-blocked { background: var(--orange-dim); color: var(--orange); border-color: color-mix(in srgb, var(--orange) 35%, transparent); }
  .status-failed { background: var(--red-dim); color: var(--red); border-color: color-mix(in srgb, var(--red) 25%, transparent); }
  .status-proposed { background: var(--purple-dim); color: var(--purple); border-color: color-mix(in srgb, var(--purple) 25%, transparent); }
  .status-approved { background: var(--teal-dim); color: var(--teal); border-color: color-mix(in srgb, var(--teal) 25%, transparent); }
  .status-muted { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }

  .wide { grid-column: 1 / -1; }

  .ops-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
  }

  .ops-card {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 0.65rem 0.75rem;
    min-width: 0;
  }

  .ops-card.ops-wide { grid-column: 1 / -1; }

  .ops-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .ops-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .ops-head .ops-label { margin-bottom: 0; }

  .ops-value { min-width: 0; }

  .chip-row, .file-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .mini-chip, .file-chip {
    font-size: 0.72rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border-soft);
    padding: 0.2rem 0.45rem;
    border-radius: 6px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-grid { max-height: 180px; overflow: auto; }
  .file-chip:hover { border-color: var(--teal); color: var(--teal); }

  .event-list {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-height: 300px;
    overflow: auto;
    padding-right: 0.1rem;
  }

  .event-row {
    display: grid;
    grid-template-columns: 3rem 1fr auto;
    gap: 0.45rem 0.65rem;
    align-items: start;
    padding: 0.4rem 0.55rem 0.4rem 0.7rem;
    border-radius: 6px;
    border: 1px solid var(--border-soft);
    background: var(--bg);
    position: relative;
    font-family: var(--font-mono);
  }

  .event-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    border-radius: 2px;
    background: var(--muted);
  }

  .event-row.fam-task::before { background: var(--amber); }
  .event-row.fam-poi::before { background: var(--teal); }
  .event-row.fam-job::before,
  .event-row.fam-route::before { background: var(--blue); }
  .event-row.fam-affinity::before,
  .event-row.fam-model::before { background: var(--gold); }
  .event-row.fam-trigger::before { background: var(--orange); }

  .event-row:hover {
    background: var(--panel-elev);
    border-color: var(--border);
  }

  .event-id {
    color: var(--muted);
    font-size: 0.72rem;
    padding-top: 0.15rem;
  }

  .event-main { min-width: 0; }

  .event-kind {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.08rem 0.4rem;
    border-radius: 999px;
    margin-bottom: 0.25rem;
    background: var(--panel-elev);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .event-row.fam-task .event-kind { background: var(--amber-dim); border-color: transparent; color: var(--amber); }
  .event-row.fam-poi .event-kind { background: var(--teal-dim); border-color: transparent; color: var(--teal); }
  .event-row.fam-job .event-kind,
  .event-row.fam-route .event-kind { background: var(--blue-dim); border-color: transparent; color: var(--blue); }
  .event-row.fam-affinity .event-kind,
  .event-row.fam-model .event-kind { background: var(--gold-dim); border-color: transparent; color: var(--gold); }
  .event-row.fam-trigger .event-kind { background: var(--orange-dim); border-color: transparent; color: var(--orange); }

  .event-payload {
    color: var(--muted);
    font-size: 0.76rem;
    word-break: break-word;
    line-height: 1.4;
  }

  .event-time {
    color: var(--muted);
    font-size: 0.7rem;
    white-space: nowrap;
    padding-top: 0.15rem;
  }

  .canvas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 0.75rem;
  }

  @media (max-width: 900px) {
    .canvas-grid { grid-template-columns: 1fr; }
  }

  .canvas-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel);
    overflow: hidden;
    min-width: 0;
  }

  .canvas-card.span-2 { grid-column: 1 / -1; }

  .canvas-head {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel-elev);
  }

  .canvas-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.55rem;
    min-width: 0;
  }

  .canvas-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .canvas-meta {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--muted);
    font-size: 0.68rem;
    font-family: var(--font-mono);
  }

  .canvas-kind {
    text-transform: lowercase;
    color: var(--muted);
  }

  .canvas-ver { color: var(--muted); }

  .canvas-body {
    padding: 0.7rem 0.75rem 0.8rem;
    max-height: 460px;
    overflow: auto;
    font-size: 0.9rem;
  }

  .canvas-body img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
  }

  .canvas-body iframe {
    width: 100%;
    border: 0;
    border-radius: 6px;
    background: #0c0b0a;
  }

  .canvas-md h1 {
    font-family: var(--font-display);
    margin: 0 0 0.55rem;
    color: var(--amber);
    font-size: 1.15rem;
    font-weight: 700;
  }
  .canvas-md h2, .canvas-md h3 {
    font-family: var(--font-display);
    margin: 0.75rem 0 0.4rem;
    color: var(--text);
    font-weight: 600;
  }
  .canvas-md h2 { font-size: 0.98rem; }
  .canvas-md h3 { font-size: 0.9rem; color: var(--muted); }
  .canvas-md p, .canvas-md li { margin: 0.35rem 0; line-height: 1.55; color: var(--text); }
  .canvas-md ul, .canvas-md ol { padding-left: 1.2rem; margin: 0.4rem 0; }
  .canvas-md code {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    background: var(--bg);
    padding: 0.05rem 0.3rem;
    border-radius: 4px;
    color: var(--teal);
  }
  .canvas-md pre {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    padding: 0.5rem 0.65rem;
    overflow: auto;
    font-size: 0.76rem;
  }
  .canvas-md pre code { background: transparent; padding: 0; color: var(--text); }
  .canvas-md a { color: var(--blue); }
  .canvas-md table {
    font-size: 0.78rem;
    margin: 0.5rem 0;
  }
  .canvas-fallback {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.78rem;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .canvas-empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 1.5rem;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
  }
  .canvas-empty code {
    color: var(--amber);
    background: var(--bg);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    z-index: 40;
  }
  .drawer-backdrop.hidden { display: none; }

  .task-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: min(480px, 100vw);
    height: 100vh;
    z-index: 50;
    background: var(--panel-elev);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 24px #00000055;
  }
  .task-drawer.hidden { display: none; }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel);
  }

  #drawer-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #drawer-close {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #drawer-close:hover { color: var(--text); border-color: var(--amber); }

  #drawer-body {
    flex: 1;
    overflow: auto;
    padding: 0.85rem 1rem 1.25rem;
  }

  .drawer-section { margin-bottom: 1rem; }

  .drawer-field {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 0.5rem 0.75rem;
    padding: 0.35rem 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .drawer-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding-top: 0.15rem;
  }

  .drawer-value {
    min-width: 0;
    font-size: 0.8rem;
    line-height: 1.45;
    word-break: break-word;
  }

  .drawer-cmd {
    margin: 0 0 0.45rem;
    padding: 0.55rem 0.65rem;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    font-size: 0.74rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 8rem;
    overflow: auto;
  }

  .drawer-log {
    margin: 0.55rem 0 0;
    padding: 0.55rem 0.65rem;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    font-size: 0.72rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 16rem;
    overflow: auto;
    color: var(--muted);
  }

  .copy-btn, .ghost-btn, .linkish {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding: 0.22rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 0.25rem;
  }

  .linkish {
    display: inline;
    border: 0;
    background: transparent;
    color: var(--blue);
    padding: 0;
    margin: 0 0.25rem 0 0;
    text-decoration: underline;
  }
  .linkish:hover { color: var(--amber); }

  .ghost-btn:hover, .copy-btn:hover { border-color: var(--amber); color: var(--amber); }
  .ghost-btn:disabled, .copy-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
      <ellipse cx="64" cy="70" rx="36" ry="30" fill="#e8a838"/>
      <ellipse cx="40" cy="38" rx="14" ry="18" fill="#e8a838"/>
      <ellipse cx="88" cy="38" rx="14" ry="18" fill="#e8a838"/>
      <ellipse cx="40" cy="38" rx="8" ry="11" fill="#c4892a"/>
      <ellipse cx="88" cy="38" rx="8" ry="11" fill="#c4892a"/>
      <ellipse cx="64" cy="78" rx="18" ry="14" fill="#f2ebe3"/>
      <ellipse cx="56" cy="78" rx="4" ry="5" fill="#3db8a0"/>
      <ellipse cx="72" cy="78" rx="4" ry="5" fill="#3db8a0"/>
      <circle cx="50" cy="58" r="3.5" fill="#141210"/>
      <circle cx="78" cy="58" r="3.5" fill="#141210"/>
    </svg>
    <div class="brand-text">
      <span class="brand-mark">porq</span>
      <span class="brand-sub">dashboard</span>
    </div>
  </div>
  <nav class="view-tabs" role="tablist" aria-label="Dashboard view">
    <button type="button" class="view-tab active" data-view="canvases" id="tab-canvases" role="tab" aria-selected="true">Canvases</button>
    <button type="button" class="view-tab" data-view="details" id="tab-details" role="tab" aria-selected="false">Details</button>
  </nav>
  <div class="header-meta">
    <span id="workspace">workspace —</span>
    <span id="stamp" aria-live="polite">connecting…</span>
  </div>
</header>
<div id="pulse" title="Open Details view" role="button" tabindex="0">
  <span class="pulse-dot" aria-hidden="true"></span>
  <span id="pulse-daemon" aria-live="polite">daemon —</span>
  <span class="pulse-chip"><strong id="pulse-tasks">0</strong> tasks</span>
  <span class="pulse-chip"><strong id="pulse-pois">0</strong> pois</span>
  <span class="pulse-chip"><strong id="pulse-jobs">0</strong> jobs</span>
  <span class="pulse-chip"><strong id="pulse-events">0</strong> events</span>
  <span class="pulse-event" id="pulse-event">waiting for pulse…</span>
</div>
<div id="error" role="alert">
  <span id="error-msg"></span>
  <button type="button" id="error-retry">Retry</button>
</div>
<div id="empty-hint" role="status"></div>

<div id="view-canvases" class="view active" role="tabpanel">
  <div id="canvases"><p class="placeholder">loading…</p></div>
</div>

<main id="view-details" class="view" role="tabpanel">
  <section class="wide">
    <div class="section-head">
      <h2>Loop ops</h2>
    </div>
    <div class="panel-body" id="ops-health"><p class="placeholder">loading…</p></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Board (POIs)</h2>
      <span class="count" id="count-board">0</span>
    </div>
    <div class="panel-body" id="board"><p class="placeholder">loading…</p></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Tasks</h2>
      <span class="count" id="count-tasks">0</span>
    </div>
    <div class="panel-body" id="tasks"><p class="placeholder">loading…</p></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Jobs / routing</h2>
      <span class="count" id="count-jobs">0</span>
    </div>
    <div class="panel-body" id="jobs"><p class="placeholder">loading…</p></div>
  </section>
  <section>
    <div class="section-head">
      <h2>Affinities</h2>
      <span class="count" id="count-aff">0</span>
    </div>
    <div class="panel-body" id="aff"><p class="placeholder">loading…</p></div>
  </section>
  <section class="wide">
    <div class="section-head">
      <h2>Recent events</h2>
      <span class="count" id="count-events">0</span>
    </div>
    <div class="panel-body" id="events"><p class="placeholder">loading…</p></div>
  </section>
  <section class="wide">
    <div class="section-head">
      <h2>Workspace files</h2>
      <span class="count" id="count-files">0</span>
    </div>
    <div class="panel-body" id="files"><p class="placeholder">loading…</p></div>
  </section>
</main>

<div id="drawer-backdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
<aside id="task-drawer" class="task-drawer hidden" aria-labelledby="drawer-title" aria-hidden="true" role="dialog">
  <div class="drawer-header">
    <h3 id="drawer-title">Task</h3>
    <button type="button" id="drawer-close" aria-label="Close task details">Close</button>
  </div>
  <div id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
