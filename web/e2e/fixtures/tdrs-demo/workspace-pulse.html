<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark light;
    --text: CanvasText;
    --muted: GrayText;
    --accent: LinkText;
    --bg: Canvas;
    --panel: Field;
    --border: GrayText;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px;
    color: var(--text);
    background: var(--panel);
    font: 12px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .live::before {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    content: "";
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .metric {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .metric strong { display: block; font-size: 20px; line-height: 1; }
  .metric span { color: var(--muted); font-size: 10px; }
  .pipeline {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .row {
    display: grid;
    grid-template-columns: 68px 1fr 42px;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
  }
  .track {
    height: 6px;
    overflow: hidden;
    border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 22%, transparent);
  }
  .fill { height: 100%; border-radius: inherit; background: var(--accent); }
  .value { color: var(--muted); text-align: right; }
</style>
</head>
<body>
  <header>
    <h1>Workspace pulse</h1>
    <span class="live">healthy</span>
  </header>

  <section class="metrics" aria-label="Workspace metrics">
    <div class="metric"><strong>5</strong><span>tasks supervised</span></div>
    <div class="metric"><strong>3</strong><span>guarded triggers</span></div>
    <div class="metric"><strong>0</strong><span>stale leases</span></div>
  </section>

  <section class="pipeline" aria-label="Pipeline progress">
    <div class="row">
      <span>Plan</span>
      <div class="track"><div class="fill" style="width:100%"></div></div>
      <span class="value">done</span>
    </div>
    <div class="row">
      <span>Execute</span>
      <div class="track"><div class="fill" style="width:100%"></div></div>
      <span class="value">done</span>
    </div>
    <div class="row">
      <span>Review</span>
      <div class="track"><div class="fill" style="width:72%"></div></div>
      <span class="value">gate</span>
    </div>
  </section>
</body>
</html>
